# Продовый стек. Запуск: docker compose -f compose.yaml up -d --build
#
# Пароль Postgres лежит в файле secrets/postgres_password, которого нет в git. Создать
# один раз:
#
#   mkdir -p secrets
#   openssl rand -hex 32 | tr -d '\n' > secrets/postgres_password
#   openssl rand -hex 32 | tr -d '\n' > secrets/registration.secret
#
# Приложение получает те же секреты через configtree: Spring читает /run/secrets как дерево
# свойств, где имя файла и есть имя свойства. Они совпадают с двумя значениями из локального
# application-prod.properties, который уже упакован в образ.
#
# Локальная разработка: приложение с профилем dev само поднимает compose.dev.yaml.
# Прод-подобная проверка без продовых секретов: compose.mock-prod.yaml.

services:
  postgres:
    image: 'postgres:18.3-trixie'
    environment:
      # Локаль задана явно, а не унаследована от образа. pg_trgm определяет «буквенность»
      # символа через LC_CTYPE: в локали C кириллица буквой не считается, из русского текста
      # не извлекается ни одной триграммы, и поиск по опечатке молча перестаёт работать.
      # Применяется только при initdb, то есть менять её можно лишь пересозданием тома.
      - 'POSTGRES_INITDB_ARGS=--encoding=UTF8 --lc-ctype=en_US.utf8 --lc-collate=en_US.utf8'
      - 'POSTGRES_DB=medapp-server-db'
      # Логин секретом не является, поэтому здесь явным значением.
      - 'POSTGRES_USER=medapp'
      - 'CATALOGUE_REQUIRED=1'
      # Официальный образ поддерживает *_FILE из коробки.
      - 'POSTGRES_PASSWORD_FILE=/run/secrets/postgres_password'
    secrets:
      - postgres_password
    volumes:
      - postgres_data:/var/lib/postgresql
      # Порядок важен, entrypoint применяет файлы по алфавиту:
      # 01 — схема приложения, она создаёт таблицы справочника;
      # 02 — данные справочника, если дамп есть.
      - ./db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./db/load-catalogue.sh:/docker-entrypoint-initdb.d/02-load-catalogue.sh:ro
      - ./db/validate-catalogue.awk:/catalogue-check/validate-catalogue.awk:ro
      - ./db/form-vocabulary.tsv:/catalogue-check/form-vocabulary.tsv:ro
      - ./db/catalogue-health.sh:/catalogue-check/catalogue-health.sh:ro
      # Каталогом, а не файлом: дампа в git нет, и при отсутствии файла Docker создал бы
      # на его месте каталог, из-за чего init базы падает. Отсутствие каталога безвредно.
      - ./init-scripts:/catalogue:ro
    # Порт наружу не публикуется: доступ только из сети data.
    healthcheck:
      test: [ "CMD", "sh", "/catalogue-check/catalogue-health.sh" ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - data
    restart: unless-stopped

  med-app-server:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      # mock-prod содержит все политики, prod активируется последним и перекрывает только
      # registration.secret и spring.datasource.password.
      - 'SPRING_PROFILES_ACTIVE=mock-prod,prod'
      - 'SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/medapp-server-db'
      - 'SPRING_DATASOURCE_USERNAME=medapp'
      # Секреты приходят файлами: configtree читает /run/secrets как дерево свойств, где
      # имя файла становится именем свойства, и перебивает даже профиль prod.
      - 'SPRING_CONFIG_IMPORT=optional:configtree:/run/secrets/'
      - 'SPRING_DATASOURCE_HIKARI_INITIALIZATION_FAIL_TIMEOUT=60000'
    secrets:
      - spring.datasource.password
      - registration.secret
    expose:
      - "8080"
    depends_on:
      postgres:
        condition: service_healthy
    # В edge — чтобы был виден Caddy, в data — чтобы видеть Postgres. Наружу не
    # публикуется: на этом держится доверие к X-Forwarded-For
    # (forward-headers-strategy=native).
    networks:
      - edge
      - data
    healthcheck:
      test: [ "CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/actuator/health" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    restart: unless-stopped

  caddy:
    image: caddy:2-alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data       # тут Caddy хранит сертификаты
      - caddy_config:/config
    depends_on:
      - med-app-server
    networks:
      - edge
    restart: unless-stopped

secrets:
  postgres_password:
    file: ./secrets/postgres_password
  # Тот же файл под именем свойства Spring: configtree читает /run/secrets, где имя файла
  # становится именем свойства.
  spring.datasource.password:
    file: ./secrets/postgres_password
  registration.secret:
    file: ./secrets/registration.secret

volumes:
  postgres_data:
  caddy_data:
  caddy_config:

networks:
  # Единственная сеть, куда смотрит внешний мир.
  edge:
    driver: bridge
  # Postgres виден только приложению.
  data:
    driver: bridge
