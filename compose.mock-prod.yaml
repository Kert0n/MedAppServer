# Прод-подобный стек для локальной проверки.
#
# Отличия от прода ровно два: секреты заведомо ненастоящие (поэтому файл спокойно лежит в
# git) и нет Caddy, чтобы не выпускать сертификат на настоящий домен. Всё остальное как в
# проде: закрытые тексты ошибок, реальный Postgres, приложение в контейнере.
#
# Нужен затем, чтобы продовый путь можно было проверить, не имея продовых секретов.
#
# Запуск: docker compose -f compose.mock-prod.yaml up -d --build

services:
  postgres:
    image: 'postgres:18.3-trixie'
    environment:
      # Локаль задана явно, а не унаследована от образа. pg_trgm определяет «буквенность»
      # символа через LC_CTYPE: в локали C кириллица буквой не считается, из русского текста
      # не извлекается ни одной триграммы, и поиск по опечатке молча перестаёт работать.
      # Применяется только при initdb, то есть менять её можно лишь пересозданием тома.
      - 'POSTGRES_INITDB_ARGS=--encoding=UTF8 --lc-ctype=en_US.utf8 --lc-collate=en_US.utf8'
      - 'POSTGRES_DB=medapp-server-db'
      - 'POSTGRES_USER=medapp'
      - 'CATALOGUE_REQUIRED=1'
      - 'POSTGRES_PASSWORD=mock-prod-password'
    volumes:
      - mock_prod_postgres_data:/var/lib/postgresql
      # Порядок важен, entrypoint применяет файлы по алфавиту:
      # 01 — схема приложения, она создаёт таблицы справочника;
      # 02 — данные справочника, если дамп есть.
      - ./db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./db/load-catalogue.sh:/docker-entrypoint-initdb.d/02-load-catalogue.sh:ro
      - ./db/validate-catalogue.awk:/catalogue-check/validate-catalogue.awk:ro
      - ./db/form-vocabulary.tsv:/catalogue-check/form-vocabulary.tsv:ro
      - ./db/catalogue-health.sh:/catalogue-check/catalogue-health.sh:ro
      - ./init-scripts:/catalogue:ro
    healthcheck:
      test: [ "CMD", "sh", "/catalogue-check/catalogue-health.sh" ]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - mock-prod

  med-app-server:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      - 'SPRING_PROFILES_ACTIVE=mock-prod'
      - 'SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/medapp-server-db'
      # Больше ничего не задаётся: вся конфигурация стенда находится в
      # application-mock-prod.properties.
      - 'SPRING_DATASOURCE_HIKARI_INITIALIZATION_FAIL_TIMEOUT=60000'
    ports:
      # В отличие от прода порт публикуется: по стенду надо стучать руками. Снаружи 18080,
      # а не 8080, чтобы стенд можно было поднять, не останавливая приложение, запущенное
      # локально из IDE, — оно занимает 8080.
      - "18080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: [ "CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/actuator/health" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 40s
    networks:
      - mock-prod

volumes:
  mock_prod_postgres_data:

networks:
  mock-prod:
    driver: bridge
