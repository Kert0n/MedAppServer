openapi: 3.1.0
info:
  title: MedApp Server API
  description: REST API for MedApp medicine kit synchronization and catalog search.
  version: 0.0.1
servers:
- url: http://localhost
  description: Generated server url
tags:
- name: Medicine kit memberships
  description: Participation of the caller in shared kits
- name: User
  description: The authenticated user
- name: Vocabularies
  description: Shared quantity units and dosage forms
- name: Drug catalogue
  description: Reference catalogue used when adding a drug
- name: Medicine kits
  description: Shared medicine kits
- name: Authentication
  description: Public endpoints for registration and token issuance
- name: Drugs
  description: Drugs stored in medicine kits
- name: Reservations
  description: How much of a package the caller claims for themselves
paths:
  /v1/med-kits/{targetMedKitId}/drugs/{drugId}:
    put:
      tags:
      - Drugs
      summary: Move a drug to another medicine kit
      description: Transfers the drug between kits.
      operationId: moveDrug
      parameters:
      - name: targetMedKitId
        in: path
        description: Target medicine kit identifier
        required: true
        schema:
          type: string
          format: uuid
      - name: drugId
        in: path
        description: Drug identifier
        required: true
        schema:
          type: string
          format: uuid
      - name: version
        in: query
        description: Version the command acts on; absent means 428
        required: false
        schema:
          type: integer
          format: int64
      responses:
        "200":
          description: Drug moved
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/DrugSnapshotDTO"
        "404":
          description: Drug or target kit is not accessible
        "401":
          description: Authentication is required
        "428":
          description: The command did not state the version it acts on
        "412":
          description: The stated version is not the current one
      security:
      - Bearer Authentication: []
  /v1/drugs/{drugId}/sync/{syncId}:
    put:
      tags:
      - Drugs
      summary: Apply offline changes to a package
      description: "Applies the consumed amount and the new claim in one transaction.\
        \ Repeating the same request under the same identifier changes nothing; the\
        \ same identifier with different content is a conflict. Identifiers are remembered\
        \ in server memory for at most 24 hours: under heavy load older ones are evicted\
        \ sooner, and a server restart forgets them all. After that a repeat is judged\
        \ as a new request (412 if the version has moved on). Once the package has\
        \ run out and was destroyed, a repeat answers 404."
      operationId: synchronise
      parameters:
      - name: drugId
        in: path
        description: Package identifier
        required: true
        schema:
          type: string
          format: uuid
      - name: syncId
        in: path
        description: Client-invented identifier of this synchronisation
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        description: Offline changes
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DrugSyncRequest"
        required: true
      responses:
        "200":
          description: "Changes applied; when the package ran out, it was destroyed\
            \ and the response body is empty"
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/DrugSnapshotDTO"
        "404":
          description: Package does not exist or is not accessible
        "409":
          description: The identifier was already used for a different request
        "401":
          description: Authentication is required
        "428":
          description: The command did not state the version it acts on
        "412":
          description: The stated version is not the current one
      security:
      - Bearer Authentication: []
  /v1/drugs/{drugId}/intakes/{intakeId}:
    put:
      tags:
      - Drugs
      summary: Record an intake
      description: "Takes the given amount out of the package. There is no distinction\
        \ between a planned intake and an emergency one: what was taken reduces the\
        \ package, and the reservation is the owner's to adjust. Taking more than\
        \ the package holds is refused: a package cannot be refilled, so a second\
        \ pack is a second package. Repeating the same request under the same identifier\
        \ changes nothing, even after the package version has moved on; the same identifier\
        \ with different content is a conflict. Identifiers are remembered in server\
        \ memory for at most 24 hours: under heavy load older ones are evicted sooner,\
        \ and a server restart forgets them all. After that a repeat is judged as\
        \ a new request (412 if the version has moved on). Once the package has run\
        \ out and was destroyed, a repeat answers 404. Returns no body when the package\
        \ ran out and was destroyed."
      operationId: recordIntake
      parameters:
      - name: drugId
        in: path
        description: Package identifier
        required: true
        schema:
          type: string
          format: uuid
      - name: intakeId
        in: path
        description: Client-invented identifier of this intake
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        description: Amount taken
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/IntakeRequest"
        required: true
      responses:
        "200":
          description: "Package reduced; when it ran out, it was destroyed and the\
            \ response body is empty"
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/DrugSnapshotDTO"
        "400":
          description: Amount exceeds what is left in the package
        "404":
          description: Package does not exist or is not accessible
        "409":
          description: The identifier was already used for a different request
        "401":
          description: Authentication is required
        "428":
          description: The command did not state the version it acts on
        "412":
          description: The stated version is not the current one
      security:
      - Bearer Authentication: []
  /v1/reservations:
    get:
      tags:
      - Reservations
      summary: List reservations
      description: Returns every reservation of the caller.
      operationId: listReservations
      responses:
        "200":
          description: Reservations returned
          content:
            '*/*':
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ReservationDTO"
        "401":
          description: Authentication is required
      security:
      - Bearer Authentication: []
    post:
      tags:
      - Reservations
      summary: Reserve part of a package
      description: "Claims an amount of the package for the caller. The amount may\
        \ exceed what is left in the package: how much of their own reservation to\
        \ keep is the owner's decision, not the server's."
      operationId: createReservation
      requestBody:
        description: Reservation to create
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReservationCreateRequest"
        required: true
      responses:
        "201":
          description: Reservation created
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ReservationDTO"
        "400":
          description: Invalid amount
        "404":
          description: Package is not accessible
        "409":
          description: Reservation on this package already exists
        "401":
          description: Authentication is required
        "428":
          description: The command did not state the version it acts on
        "412":
          description: The stated version is not the current one
      security:
      - Bearer Authentication: []
  /v1/med-kits:
    get:
      tags:
      - Medicine kits
      summary: List medicine kits
      description: "Returns counters for every kit of the caller, without loading\
        \ their contents."
      operationId: listMedKits
      responses:
        "200":
          description: Kits returned
          content:
            '*/*':
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/MedKitSummaryDTO"
                uniqueItems: true
        "401":
          description: Authentication is required
      security:
      - Bearer Authentication: []
    post:
      tags:
      - Medicine kits
      summary: Create a medicine kit
      description: Creates a kit owned by nobody in particular.
      operationId: createMedKit
      requestBody:
        description: Medicine kit to create
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MedKitCreateRequest"
        required: true
      responses:
        "201":
          description: Kit created
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/MedKitCreatedDTO"
        "400":
          description: Invalid request
        "409":
          description: A kit with this identifier already exists
        "401":
          description: Authentication is required
      security:
      - Bearer Authentication: []
  /v1/med-kits/{medKitId}/invitations:
    post:
      tags:
      - Medicine kits
      summary: Create an invitation
      description: Issues a key others can use to join the kit.
      operationId: createInvitation
      parameters:
      - name: medKitId
        in: path
        description: Medicine kit identifier
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "201":
          description: Invitation created
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/InvitationDTO"
        "404":
          description: Kit does not exist or is not accessible
        "401":
          description: Authentication is required
      security:
      - Bearer Authentication: []
  /v1/med-kits/{medKitId}/drugs:
    post:
      tags:
      - Drugs
      summary: Add a drug to a medicine kit
      description: Creates a drug in the given kit.
      operationId: createDrug
      parameters:
      - name: medKitId
        in: path
        description: Medicine kit identifier
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        description: Drug to create
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DrugCreateRequest"
        required: true
      responses:
        "201":
          description: Drug created
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/DrugSnapshotDTO"
        "400":
          description: Invalid request
        "404":
          description: Medicine kit is not accessible
        "409":
          description: A drug with this identifier already exists
        "401":
          description: Authentication is required
      security:
      - Bearer Authentication: []
  /v1/med-kit-memberships:
    post:
      tags:
      - Medicine kit memberships
      summary: Join a medicine kit
      description: Accepts an invitation and joins the kit.
      operationId: joinMedKit
      requestBody:
        description: Invitation key
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MembershipCreateRequest"
        required: true
      responses:
        "201":
          description: Joined
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/MedKitDTO"
        "409":
          description: Caller is already a member
        "404":
          description: Invitation expired or unknown
        "401":
          description: Authentication is required
      security:
      - Bearer Authentication: []
  /v1/auth/token:
    post:
      tags:
      - Authentication
      summary: Issue JWT token
      description: "Uses HTTP Basic authentication and returns a JWT access token.\
        \ The token carries its own expiry in the `exp` claim; use it as `Authorization:\
        \ Bearer <token>`."
      operationId: token
      responses:
        "200":
          description: JWT token issued
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/TokenResponse"
        "401":
          description: Invalid credentials
        "429":
          description: Too many token requests
      security:
      - Basic Authentication: []
  /v1/auth/register:
    post:
      tags:
      - Authentication
      summary: Register a new user
      description: "Creates a user with the login and password chosen by the client.\
        \ The credentials are known before the request is sent, so a lost response\
        \ is safe to repeat: the repeat answers 409, and a token issued with the same\
        \ credentials confirms the account is the caller's own."
      operationId: register
      parameters:
      - name: X-Registration-Token
        in: header
        description: Shared registration secret
        required: true
        schema:
          type: string
        example: dev-secret
      requestBody:
        description: Credentials chosen by the client
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterRequest"
        required: true
      responses:
        "201":
          description: User registered
        "400":
          description: Invalid login or password
        "403":
          description: Invalid registration secret
        "409":
          description: The login is already taken
        "429":
          description: Too many registration attempts
  /v1/reservations/{drugId}:
    get:
      tags:
      - Reservations
      summary: Get a reservation
      description: Returns the caller's reservation on the package.
      operationId: getReservation
      parameters:
      - name: drugId
        in: path
        description: Package identifier
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "200":
          description: Reservation found
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ReservationDTO"
        "404":
          description: No reservation on this package
        "401":
          description: Authentication is required
      security:
      - Bearer Authentication: []
    delete:
      tags:
      - Reservations
      summary: Cancel a reservation
      description: "Releases the claim. A reservation of zero does not exist, so cancelling\
        \ is a deletion."
      operationId: deleteReservation
      parameters:
      - name: drugId
        in: path
        description: Package identifier
        required: true
        schema:
          type: string
          format: uuid
      - name: version
        in: query
        description: Version the command acts on; absent means 428
        required: false
        schema:
          type: integer
          format: int64
      responses:
        "204":
          description: Reservation cancelled
        "404":
          description: No reservation on this package
        "401":
          description: Authentication is required
        "428":
          description: The command did not state the version it acts on
        "412":
          description: The stated version is not the current one
      security:
      - Bearer Authentication: []
    patch:
      tags:
      - Reservations
      summary: Change the reserved amount
      description: Sets a new reserved amount. It may exceed what is left in the package.
      operationId: patchReservation
      parameters:
      - name: drugId
        in: path
        description: Package identifier
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        description: New reserved amount
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReservationPatchRequest"
        required: true
      responses:
        "200":
          description: Reservation updated
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ReservationDTO"
        "400":
          description: Invalid amount
        "404":
          description: No reservation on this package
        "401":
          description: Authentication is required
        "428":
          description: The command did not state the version it acts on
        "412":
          description: The stated version is not the current one
      security:
      - Bearer Authentication: []
  /v1/drugs/{drugId}:
    get:
      tags:
      - Drugs
      summary: Get a drug
      description: Returns a drug the caller has access to.
      operationId: getDrug
      parameters:
      - name: drugId
        in: path
        description: Drug identifier
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "200":
          description: Drug found
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/DrugSnapshotDTO"
        "404":
          description: Drug does not exist or is not accessible
        "401":
          description: Authentication is required
      security:
      - Bearer Authentication: []
    delete:
      tags:
      - Drugs
      summary: Delete a drug
      description: Destroys the package and every reservation placed on it.
      operationId: deleteDrug
      parameters:
      - name: drugId
        in: path
        description: Drug identifier
        required: true
        schema:
          type: string
          format: uuid
      - name: version
        in: query
        description: Version the command acts on; absent means 428
        required: false
        schema:
          type: integer
          format: int64
      responses:
        "204":
          description: Drug deleted
        "404":
          description: Drug does not exist or is not accessible
        "401":
          description: Authentication is required
        "428":
          description: The command did not state the version it acts on
        "412":
          description: The stated version is not the current one
      security:
      - Bearer Authentication: []
    patch:
      tags:
      - Drugs
      summary: Update a package
      description: "Changes the given fields; absent fields are left as they are.\
        \ Quantity here is a correction of the record — you recounted the pack and\
        \ saw a different number — not a refill, and it leaves reservations alone."
      operationId: patchDrug
      parameters:
      - name: drugId
        in: path
        description: Drug identifier
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        description: Fields to change
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DrugPatchRequest"
        required: true
      responses:
        "200":
          description: Drug updated
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/DrugSnapshotDTO"
        "400":
          description: Invalid request
        "404":
          description: Drug does not exist or is not accessible
        "401":
          description: Authentication is required
        "428":
          description: The command did not state the version it acts on
        "412":
          description: The stated version is not the current one
      security:
      - Bearer Authentication: []
  /v1/users/me:
    get:
      tags:
      - User
      summary: Get the caller's snapshot
      description: "Returns the caller identifier with every accessible medicine kit\
        \ and its drugs, for sync."
      operationId: getSnapshot
      responses:
        "200":
          description: Snapshot returned
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/UserSnapshotDTO"
        "401":
          description: Authentication is required
      security:
      - Bearer Authentication: []
  /v1/quantity-units:
    get:
      tags:
      - Vocabularies
      summary: List quantity units
      description: "Shared vocabulary of quantity units. A drug references a unit\
        \ by identifier, so this list is where the identifier comes from."
      operationId: listQuantityUnits
      responses:
        "200":
          description: Units returned
          content:
            '*/*':
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/VocabularyEntryDTO"
        "401":
          description: Authentication is required
      security:
      - Bearer Authentication: []
  /v1/med-kits/{medKitId}:
    get:
      tags:
      - Medicine kits
      summary: Get a medicine kit
      description: Returns the kit with its drugs.
      operationId: getMedKit
      parameters:
      - name: medKitId
        in: path
        description: Medicine kit identifier
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "200":
          description: Kit found
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/MedKitDTO"
        "404":
          description: Kit does not exist or is not accessible
        "401":
          description: Authentication is required
      security:
      - Bearer Authentication: []
    delete:
      tags:
      - Medicine kits
      summary: Delete a medicine kit
      description: "Deletes the kit for every participant, including its packages\
        \ and the reservations on them. Use when the physical kit no longer exists\
        \ as a shared thing. Pass targetMedKitId to move the drugs into another kit\
        \ of yours instead of discarding them. To leave a shared kit without destroying\
        \ it, delete your membership instead."
      operationId: deleteMedKit
      parameters:
      - name: medKitId
        in: path
        description: Medicine kit identifier
        required: true
        schema:
          type: string
          format: uuid
      - name: targetMedKitId
        in: query
        description: Kit to move the drugs into instead of discarding them
        required: false
        schema:
          type: string
          format: uuid
      responses:
        "204":
          description: Kit deleted for everyone
        "404":
          description: Kit does not exist or is not accessible
        "401":
          description: Authentication is required
      security:
      - Bearer Authentication: []
  /v1/form-types:
    get:
      tags:
      - Vocabularies
      summary: List dosage forms
      description: "Shared vocabulary of dosage forms, used the same way as quantity\
        \ units."
      operationId: listFormTypes
      responses:
        "200":
          description: Dosage forms returned
          content:
            '*/*':
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/VocabularyEntryDTO"
        "401":
          description: Authentication is required
      security:
      - Bearer Authentication: []
  /v1/drug-templates:
    get:
      tags:
      - Drug catalogue
      summary: Search the catalogue
      description: "Searches by name, Latin name, active substance and manufacturer."
      operationId: searchDrugTemplates
      parameters:
      - name: query
        in: query
        description: Search query
        required: true
        schema:
          type: string
          maxLength: 200
          minLength: 1
      - name: limit
        in: query
        description: Maximum number of results
        required: false
        schema:
          type: integer
          format: int32
          maximum: 50
          minimum: 1
      responses:
        "200":
          description: Matches found
          content:
            '*/*':
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/DrugTemplateDTO"
        "400":
          description: Invalid query or limit
        "401":
          description: Authentication is required
      security:
      - Bearer Authentication: []
  /v1/drug-templates/{templateId}:
    get:
      tags:
      - Drug catalogue
      summary: Get a catalogue entry
      description: Returns a single catalogue entry.
      operationId: getDrugTemplate
      parameters:
      - name: templateId
        in: path
        description: Template identifier
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "200":
          description: Entry found
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/DrugTemplateDTO"
        "404":
          description: Entry does not exist
        "401":
          description: Authentication is required
      security:
      - Bearer Authentication: []
  /v1/med-kit-memberships/{medKitId}:
    delete:
      tags:
      - Medicine kit memberships
      summary: Leave a medicine kit
      description: Removes the caller from the kit together with their reservations
        in it. The kit itself and other participants stay.
      operationId: leaveMedKit
      parameters:
      - name: medKitId
        in: path
        description: Medicine kit identifier
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "204":
          description: Left the kit
        "404":
          description: Kit does not exist or is not accessible
        "401":
          description: Authentication is required
      security:
      - Bearer Authentication: []
components:
  schemas:
    DrugDTO:
      type: object
      description: Drug stock and descriptive fields
      properties:
        id:
          type: string
          format: uuid
          description: Drug identifier
        name:
          type: string
          description: Drug name
          example: Aspirin
        quantity:
          type: string
          description: Current stock
          examples:
          - "100.000000"
          pattern: "^\\d{1,13}(\\.\\d{1,6})?$"
        quantityUnitId:
          type: string
          format: uuid
          description: Quantity unit identifier
        formTypeId:
          type:
          - string
          - "null"
          format: uuid
          description: Dosage form identifier
        category:
          type:
          - string
          - "null"
          description: Category
          example: painkiller
        manufacturer:
          type:
          - string
          - "null"
          description: Manufacturer
          example: Bayer
        country:
          type:
          - string
          - "null"
          description: Country
          example: Germany
        description:
          type:
          - string
          - "null"
          description: Description
        medKitId:
          type: string
          format: uuid
          description: Medicine kit the drug belongs to
        version:
          type: integer
          format: int64
          description: Version of the package state; state it back when commanding
          example: 3
      required:
      - category
      - country
      - description
      - formTypeId
      - id
      - manufacturer
      - medKitId
      - name
      - quantity
      - quantityUnitId
      - version
    DrugSnapshotDTO:
      type: object
      description: Package with what is claimed on it
      properties:
        drug:
          $ref: "#/components/schemas/DrugDTO"
          description: The package itself
        reservations:
          $ref: "#/components/schemas/ReservationsDTO"
          description: What is claimed on it
      required:
      - drug
      - reservations
    ReservationsDTO:
      type: object
      description: What is claimed on the package
      properties:
        total:
          type: string
          description: Sum of all reservations; may exceed the stock
          examples:
          - "40.000000"
          pattern: "^\\d{1,13}(\\.\\d{1,6})?$"
        mine:
          type:
          - string
          - "null"
          description: Reserved by the caller; absent when they claimed nothing
          pattern: "^(?!0+(\\.0+)?$)\\d{1,13}(\\.\\d{1,6})?$"
        version:
          type: integer
          format: int64
          description: Version of the claims on this package; state it back when commanding
          example: 5
      required:
      - mine
      - total
      - version
    DrugSyncRequest:
      type: object
      description: "Offline changes for one package, applied atomically"
      properties:
        consumed:
          type:
          - string
          - "null"
          description: "Amount consumed while offline; a delta, omitted when nothing\
            \ was taken"
          examples:
          - "5.0"
          exclusiveMinimum: 0.0
          pattern: "^(?!0+(\\.0+)?$)\\d{1,13}(\\.\\d{1,6})?$"
          example: null
        drugVersion:
          type:
          - integer
          - "null"
          format: int64
          description: "Version of the package state; required when consumed is present.\
            \ Missing means 428, stale means 412"
          example: 3
        reservation:
          description: New state of the caller's claim; omitted when it did not change
          oneOf:
          - $ref: "#/components/schemas/ReservationSyncRequest"
          - type: "null"
    ReservationSyncRequest:
      type: object
      description: The caller's claim after the offline session
      properties:
        amount:
          type: string
          description: "Claim after the offline session, absolute"
          examples:
          - "20.0"
          exclusiveMinimum: 0.0
          pattern: "^(?!0+(\\.0+)?$)\\d{1,13}(\\.\\d{1,6})?$"
          example: null
        version:
          type:
          - integer
          - "null"
          format: int64
          description: "Version of the claims picture; when absent, the server uses\
            \ the current picture read while processing the request. A supplied stale\
            \ version means 412"
      required:
      - amount
    IntakeRequest:
      type: object
      description: Amount taken out of the package
      properties:
        quantity:
          type: string
          description: "Amount taken, greater than zero"
          examples:
          - "2.0"
          exclusiveMinimum: 0.0
          pattern: "^(?!0+(\\.0+)?$)\\d{1,13}(\\.\\d{1,6})?$"
          example: null
        version:
          type:
          - integer
          - "null"
          format: int64
          description: "Version the command acts on; taken from the last read. Absent\
            \ means 428, mismatched means 412"
          example: 3
      required:
      - quantity
    ReservationCreateRequest:
      type: object
      description: Request to reserve part of a package
      properties:
        drugId:
          type: string
          format: uuid
          description: Package identifier
        amount:
          type: string
          description: "Reserved amount, greater than zero. It may exceed what is\
            \ left in the package."
          examples:
          - "20.0"
          exclusiveMinimum: 0.0
          pattern: "^(?!0+(\\.0+)?$)\\d{1,13}(\\.\\d{1,6})?$"
          example: null
        version:
          type:
          - integer
          - "null"
          format: int64
          description: "Version the command acts on; taken from the last read. Absent\
            \ means 428, mismatched means 412"
          example: 5
      required:
      - amount
      - drugId
    ReservationDTO:
      type: object
      description: How much of a package the caller claims for themselves
      properties:
        drugId:
          type: string
          format: uuid
          description: Package the reservation is placed on
        amount:
          type: string
          description: Reserved amount; may exceed what is left in the package
          examples:
          - "20.000000"
          pattern: "^(?!0+(\\.0+)?$)\\d{1,13}(\\.\\d{1,6})?$"
      required:
      - amount
      - drugId
    MedKitCreateRequest:
      type: object
      description: Request to create a medicine kit
      properties:
        id:
          type: string
          format: uuid
          description: "Client-invented identifier of the medicine kit. Repeating\
            \ a request with the same identifier conflicts instead of creating a second\
            \ kit, so a lost response can be retried"
          example: 3f1c8a92-7b64-4d21-8e05-9a3d6c2f1b47
      required:
      - id
    MedKitCreatedDTO:
      type: object
      description: Created medicine kit
      properties:
        id:
          type: string
          format: uuid
          description: Medicine kit identifier
      required:
      - id
    InvitationDTO:
      type: object
      description: Invitation to join a medicine kit
      properties:
        key:
          type: string
          description: Key to join the kit; valid for a limited time and reusable
            within it
      required:
      - key
    DrugCreateRequest:
      type: object
      description: Request to add a drug to a medicine kit
      properties:
        id:
          type: string
          format: uuid
          description: "Client-invented identifier of the drug. Repeating a request\
            \ with the same identifier conflicts instead of creating a second drug,\
            \ so a lost response can be retried"
          example: 8d54b1e1-3a9a-4f0e-9d6b-2c1f5a7e4b30
        name:
          type: string
          description: Drug name
          example: Aspirin
          maxLength: 300
          minLength: 1
        quantity:
          type: string
          description: "Initial stock, greater than zero"
          examples:
          - "100.0"
          exclusiveMinimum: 0.0
          pattern: "^(?!0+(\\.0+)?$)\\d{1,13}(\\.\\d{1,6})?$"
          example: null
        quantityUnitId:
          type: string
          format: uuid
          description: Quantity unit identifier from the shared vocabulary
        formTypeId:
          type:
          - string
          - "null"
          format: uuid
          description: Dosage form identifier from the shared vocabulary
        category:
          type:
          - string
          - "null"
          description: Category
          example: painkiller
          maxLength: 200
          minLength: 0
        manufacturer:
          type:
          - string
          - "null"
          description: Manufacturer
          example: Bayer
          maxLength: 300
          minLength: 0
        country:
          type:
          - string
          - "null"
          description: Country
          example: Germany
          maxLength: 100
          minLength: 0
        description:
          type:
          - string
          - "null"
          description: Description
          maxLength: 4000
          minLength: 0
      required:
      - id
      - name
      - quantity
      - quantityUnitId
    MembershipCreateRequest:
      type: object
      description: Request to join a medicine kit by invitation
      properties:
        key:
          type: string
          description: Invitation key
          example: sSQUCT8iOjYsobZ7StyspQ
          minLength: 1
      required:
      - key
    MedKitDTO:
      type: object
      description: Medicine kit with its drugs
      properties:
        id:
