          type:
          - string
          - "null"
          format: uuid
          description: Dosage form identifier from the shared vocabulary
        category:
          type:
          - string
          - "null"
          description: Category
          example: painkiller
          maxLength: 200
          minLength: 0
        manufacturer:
          type:
          - string
          - "null"
          description: Manufacturer
          example: Bayer
          maxLength: 300
          minLength: 0
        country:
          type:
          - string
          - "null"
          description: Country
          example: Germany
          maxLength: 100
          minLength: 0
        description:
          type:
          - string
          - "null"
          description: Description
          maxLength: 4000
          minLength: 0
        version:
          type:
          - integer
