      - userCount
    TokenResponse:
      type: object
      description: Issued access token
      properties:
        accessToken:
          type: string
          description: JWT access token
      required:
      - accessToken
    RegisterRequest:
      type: object
      description: Credentials chosen by the client
      properties:
        login:
          type: string
          format: uuid
          description: Client-invented login identifier
        password:
          type: string
          description: "Secret key: 32 to 72 printable ASCII characters, no spaces"
          maxLength: 72
          minLength: 32
          pattern: "^[\\x21-\\x7E]+$"
      required:
      - login
      - password
    ReservationPatchRequest:
      type: object
      description: Request to change the reserved amount
      properties:
        amount:
