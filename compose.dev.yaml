# Локальная БД для разработки. Поднимается автоматически при запуске приложения с профилем
# dev: spring-boot-docker-compose подхватывает этот файл (см. spring.docker.compose.file в
# application-dev.properties) и сам подставляет параметры подключения.
#
# Значения захардкожены: база одноразовая, живёт на localhost и пересоздаётся. Требовать
# внешние секреты для запуска из IDE было бы неправильно.
#
# Прод: docker compose -f compose.yaml up -d
# Прод-подобная проверка: docker compose -f compose.mock-prod.yaml up -d --build

services:
  postgres:
    image: 'postgres:18.3-trixie'
    environment:
      # Локаль задана явно, а не унаследована от образа. pg_trgm определяет «буквенность»
      # символа через LC_CTYPE: в локали C кириллица буквой не считается, из русского текста
      # не извлекается ни одной триграммы, и поиск по опечатке молча перестаёт работать.
      # Применяется только при initdb, то есть менять её можно лишь пересозданием тома.
      - 'POSTGRES_INITDB_ARGS=--encoding=UTF8 --lc-ctype=en_US.utf8 --lc-collate=en_US.utf8'
      - 'POSTGRES_DB=medapp-server-db'
      - 'POSTGRES_USER=medapp'
      - 'POSTGRES_PASSWORD=medapp'
    volumes:
      # Порядок важен, entrypoint применяет файлы по алфавиту:
      # 01 — схема приложения, она создаёт таблицы справочника;
      # 02 — данные справочника, если дамп есть.
      - ./db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./db/load-catalogue.sh:/docker-entrypoint-initdb.d/02-load-catalogue.sh:ro
      - ./db/validate-catalogue.awk:/catalogue-check/validate-catalogue.awk:ro
      - ./db/form-vocabulary.tsv:/catalogue-check/form-vocabulary.tsv:ro
      # Каталогом, а не файлом: дампа в git нет, и при отсутствии файла Docker создал бы
      # на его месте каталог, из-за чего init базы падает. Отсутствие каталога безвредно.
      - ./init-scripts:/catalogue:ro
    ports:
      # Публикуется, потому что приложение запускается на хосте, а не в контейнере.
      - "5432:5432"
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U medapp -d medapp-server-db" ]
      interval: 5s
      timeout: 5s
      retries: 10
